services:
  postgres:
    image: postgres:16-alpine
    container_name: reloqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reloqa}
      POSTGRES_USER: ${POSTGRES_USER:-reloqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reloqa}
    ports:
      - "5432:5432"
    volumes:
      - reloqa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reloqa -d reloqa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reloqa_pgdata:
